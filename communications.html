<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Communications | ATI Pilots · ALPA</title>
  <meta name="description" content="The official site of the Air Transport International Master Executive Council of the Air Line Pilots Association, International." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body data-page="comms">
  <div id="site-header"></div>
  <main id="main">
    <section class="page-hero">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><i data-icon="chevron"></i><span>Communications</span></nav>
        <h1>Communications</h1>
        <p>MEC Alerts, Skypointer, Hotline updates, the SPSC Newsletter and every all-pilot call, all in one searchable feed.</p>
      </div>
    </section>
    <section class="section section--tight">
      <div class="container" data-comms>
        <div class="filterbar">
          <div class="chips" role="toolbar" aria-label="Filter by type"></div>

      </div>

      <div class="container call-feature">
        <a class="player reveal" href="#" aria-label="Play the latest all-pilot call">

        </a>

          <span class="eyebrow">Recordings</span>
          <h2 class="h2" style="margin-top:16px">All-Pilot Calls</h2>
          <div class="call-list" data-calls></div>
        </div>
      </div>
